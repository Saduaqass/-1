<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитка — Садвакасов Арсен</title>
    <style>
        /* Сброс базовых стилей */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Настройка фона и шрифта */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        /* Главная карточка */
        .business-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            width: 100%;
            max-width: 380px;
            transition: transform 0.2s ease;
        }

        .business-card:hover {
            transform: translateY(-5px);
        }

        /* Шапка: Имя и профессия */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .profession {
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Список контактов */
        .contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #4b5563;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            background-color: #f3f4f6;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .contact-item.link:hover {
            background-color: #e5e7eb;
            color: #111827;
        }

        .icon {
            margin-right: 12px;
            font-size: 18px;
        }

        /* Блок соцсетей */
        .social-links {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            background-color: #f3f4f6;
            transition: background-color 0.2s, color 0.2s;
        }

        .social-btn:hover {
            background-color: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>

    <div class="business-card">
        <div class="header">
            <h1 class="name">Садвакасов Арсен</h1>
            <p class="profession">Бағдарламалық қамтамасыз ету</p>
        </div>

        <div class="contacts">
            <a href="tel:+77775323200" class="contact-item link">
                <span class="icon">📞</span> +7 777 532 32 00
            </a>
            
            <a href="mailto:sadvakassov.arsen@gmail.com" class="contact-item link">
                <span class="icon">📧</span> sadvakassov.arsen@gmail.com
            </a>

            <div class="contact-item">
                <span class="icon">📍</span> Есік
            </div>
        </div>

        <div class="social-links">
            <a href="https://instagram.com/sadvakasov.a.s" target="_blank" class="social-btn">Instagram</a>
            <a href="https://t.me/sadvakasov.a.s" target="_blank" class="social-btn">Telegram</a>
        </div>
    </div>

</body>
</html>
